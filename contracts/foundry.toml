[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
optimizer = true
optimizer_runs = 200

remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"
]

[rpc_endpoints]
fuji = "${AVALANCHE_FUJI_RPC_URL}"

[etherscan]
fuji = { key = "${ETHERSCAN_API_KEY}", chain = 43113 }
